<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · 入口</title>
<!-- reporter portal-template（OPTIONAL landing page asset，需要總覽式入口的案子才用，不用就不建）。
     上線時只填 report-meta.json（最小核心＋有用到的可選欄位），本檔不用改。
     部署：本檔存為工作區 portal.html，同目錄放 report-meta.json，
     libs/（echarts.min.js、reporter-charts.js）與 index.html（站內閱讀器）須在相對路徑可達。 -->
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#222;--line:#ddd;--acc:#1a73e8;--mut:#666}
[data-theme=dark]{--bg:#121212;--card:#1e1e1e;--ink:#e0e0e0;--line:#444;--acc:#8ab4f8;--mut:#aaa}
*{box-sizing:border-box}body{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:32px 20px}
.hero{background:var(--card);border-radius:12px;padding:36px 32px;box-shadow:0 1px 4px rgba(0,0,0,.12);border-top:6px solid var(--acc)}
.hero .date{font-size:.85em;color:var(--mut)}
.hero h1{margin:8px 0;font-size:1.8em}
.hero .headline{font-size:1.15em;margin-top:8px}
.hero .headline b{color:var(--acc)}
.btns{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}
.btns a{background:var(--acc);color:#fff;text-decoration:none;border-radius:8px;padding:10px 22px;font-size:.95em}
.btns a.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
h2{font-size:1.2em;margin:32px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.card .k{font-size:.8em;color:var(--mut)}
.card .v{font-size:1.05em;font-weight:bold;margin:4px 0}
.card .d{font-size:.85em;opacity:.85}
.trustbox{background:var(--card);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:140px;background:var(--card);border-radius:10px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.kpi .n{font-size:1.5em;font-weight:bold;color:var(--acc)}
.kpi .l{font-size:.8em;color:var(--mut);margin-top:4px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.chartbox{background:var(--card);border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.echart{width:100%;height:300px}
.chartnote{font-size:.8em;opacity:.65;margin-top:4px}
.chapters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.chapters a{background:var(--card);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1);display:block}
.chapters a:hover{border:1px solid var(--acc)}
.chapters b{display:block;margin-bottom:4px}
.chapters small{color:var(--mut)}
#themeBtn{position:fixed;right:16px;top:16px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}
footer{margin:32px 0 8px;font-size:.8em;color:var(--mut);text-align:center}
@media print{.btns,#themeBtn{display:none}}
</style>
</head>
<body>
<button id="themeBtn">🌙 深色</button>
<div class="wrap" id="root"><p>載入中…（請經本地伺服器開啟，見 start_server.bat）</p></div>
<script src="libs/echarts.min.js"></script>
<script src="libs/reporter-charts.js"></script>
<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function safeUrl(u){u=String(u||'');if(/^\s*(javascript|data|vbscript|file|blob):/i.test(u))return '#';if(/^(https?:\/\/[^\s"'<>\\]+|\/[^\/\\][^"'<>]*|[^:\/\\?"'<>][^"'<>]*)$/.test(u))return u;return '#'}
function theme(){return document.documentElement.dataset.theme==='dark'}
function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);
  document.getElementById('themeBtn').textContent=t==='dark'?'\u2600\ufe0f \u6dfa\u8272':'\ud83c\udf19 \u6df1\u8272';draw()}
let META=null;
function draw(){
  if(!META||typeof echarts==='undefined')return;
  const ink=theme()?'#e0e0e0':'#222';
  (META.charts||[]).forEach((c,i)=>{
    const el=document.getElementById('c'+i);if(!el)return;
    const old=echarts.getInstanceByDom(el);if(old)old.dispose();
    try{echarts.init(el).setOption(reporterChartOption(c,ink))}
    catch(e){el.outerHTML='<p>圖表載入失敗</p>'}
  });
}
function trustHtml(){
  const t=META.trust||{};
  const rows=[
    ['資料截止', t.cutoff||META.date||''],
    ['主要證據', (t.sources||[]).join('、')],
    ['主要證據基礎', (t.evidence_basis||[]).join('、')],
    ['未決問題', (t.unresolved||[]).join('；')],
    ['對造回應', t.right_of_reply||''],
    ['更新更正', (t.changelog||[]).join('；')]
  ].filter(r=>r[1]);
  if(!rows.length)return '<p>暫無額外說明，見內文。</p>';
  return '<ul>'+rows.map(r=>'<li><b>'+esc(r[0])+'：</b>'+esc(r[1])+'</li>').join('')+'</ul>';
}
async function main(){
  applyTheme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
  document.getElementById('themeBtn').onclick=()=>applyTheme(theme()?'light':'dark');
  const r=await fetch('report-meta.json');META=await r.json();
  document.title=(META.title||'報告')+' · 入口';
  document.documentElement.lang=META.lang||'zh-Hant';
  const root=document.getElementById('root');
  root.innerHTML=
    '<div class="hero"><div class="date">查證基準日：'+esc(META.date||'')+'</div>'+
    '<h1>'+esc(META.title||'')+'</h1>'+
    '<div class="headline">'+esc(META.headline_answer||'')+'</div>'+
    '<div class="btns"><a href="index.html">進入完整報告</a></div></div>'+
    '<h2>執行摘要</h2><div class="cards">'+(META.summary||[]).map(c=>
      '<div class="card"><div class="k">'+esc(c.k)+'</div><div class="v">'+esc(c.v)+
      '</div><div class="d">'+esc(c.d||'')+'</div></div>').join('')+'</div>'+
    '<h2>可信度說明</h2><div class="trustbox">'+trustHtml()+'</div>'+
    '<h2>關鍵指標</h2><div class="kpis">'+(META.kpis||[]).map(k=>
      '<div class="kpi"><div class="n">'+esc(k.n)+'</div><div class="l">'+esc(k.l)+'</div></div>').join('')+'</div>'+
    '<h2>圖表</h2><div class="charts">'+(META.charts||[]).map((c,i)=>
      '<div class="chartbox"><div class="echart" id="c'+i+'"></div>'+
      (c.note?'<div class="chartnote">'+esc(c.note)+'</div>':'')+'</div>').join('')+'</div>'+
    '<h2>章節</h2><div class="chapters">'+(META.chapters||[]).map(c=>
      '<a href="'+safeUrl(c.path)+'"><b>'+esc(c.t)+'</b><small>'+esc(c.d||'')+'</small></a>').join('')+'</div>'+
    '<h2>缺口與未決</h2><div id="gaps"><p>載入中…</p></div>'+
    '<footer>'+esc(META.footer||'結論以內文證據為準。')+'</footer>';
  try{
    const gr=await fetch('gaps.json');
    if(gr.ok){
      const gaps=await gr.json();
      document.getElementById('gaps').innerHTML='<ul>'+gaps.map(g=>
        '<li>'+esc(g.item||'')+'（'+esc(g.status||'')+'）</li>').join('')+'</ul>';
    }else{document.getElementById('gaps').innerHTML='<p>無缺口紀錄。</p>'}
  }catch(e){document.getElementById('gaps').innerHTML='<p>無缺口紀錄。</p>'}
  draw();
}
main();
</script>
</body>
</html>
